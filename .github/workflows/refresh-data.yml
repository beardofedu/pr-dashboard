name: Refresh PR Metrics

on:
  schedule:
    # Run at 9am UTC daily
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  refresh-metrics:
    runs-on: ubuntu-latest
    env:
      # Comma-separated list of repositories in owner/name format.
      # If unset, defaults to this repository.
      MONITORED_REPOS: ${{ vars.PR_DASHBOARD_REPOS }}
      GH_TOKEN: ${{ secrets.PR_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure required secret exists
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing required repository secret: PR_DASHBOARD_TOKEN"
            echo "Add it in Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate metrics data
        run: node scripts/generate-metrics.mjs

      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add data/pr-metrics.yml
            git commit -m "chore: update PR metrics - $(date -u +%Y-%m-%d)"
            git push
          fi
